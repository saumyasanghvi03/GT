version: '3.9'
services:
  api:
    build: ./apps/api-server
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=replace-me
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgres://postgres:postgres@postgres:5432/pramana
    depends_on:
      - redis
      - postgres
  frontend:
    build: ./apps/terminal-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: pramana
    ports:
      - "5432:5432"
